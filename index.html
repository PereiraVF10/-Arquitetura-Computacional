<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitetura Computacional Cruzadinha</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Arquitetura Computacional Cruzadinha</h1>
        <p>Preencha a cruzadinha com todos os termos da disciplina e teste seus conhecimentos!</p>
    </header>

    <main class="game-container">
        <!-- Tabuleiro da Cruzadinha -->
        <section class="board-section">
            <div id="crossword-board" class="board"></div>
            <div class="controls">
                <button id="btn-check" class="btn">Conferir Respostas</button>
                <button id="btn-reset" class="btn secondary">Reiniciar Jogo</button>
            </div>
            <div id="score-display" class="score"></div>
        </section>

        <!-- Dicas à direita (Numeradas, sem respostas antecipadas) -->
        <section class="clues-section">
            <h2>Pistas</h2>
            
            <div class="clue-group">
                <h3>Horizontais</h3>
                <ul id="horizontal-clues">
                    <!-- Geradas dinamicamente via script para exibir a resposta apenas ao completar/conferir -->
                </ul>
            </div>

            <div class="clue-group">
                <h3>Verticais</h3>
                <ul id="vertical-clues">
                    <!-- Geradas dinamicamente via script -->
                </ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
