<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitetura Computacional Cruzadinha</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <h1>Arquitetura Computacional Cruzadinha - ACC!</h1>
        <p>como um computador realmente funciona por dentro</p> <br>
        <p>Estagiário Tux você foi chamado para resolver um problema</p>
        <!-- Placar visível logo abaixo do cabeçalho -->
        <div id="score-display" class="score-header">0 de 16 palavras corretas.</div>
    </header>

    <main class="game-container">
        <!-- Tabuleiro da Cruzadinha -->
        <section class="board-section">
            <div id="crossword-board" class="board"></div>
            <div class="controls">
                <button id="btn-check" class="btn">Conferir Respostas</button>
                <button id="btn-reset" class="btn secondary">Reiniciar Jogo</button>
            </div>
        </section>

        <!-- Dicas à direita (Numeradas, sem respostas antecipadas) -->
        <section class="clues-section">
            <h2>Pistas</h2>

            <div class="clue-group">
                <h3>Horizontais</h3>
                <ul id="horizontal-clues"></ul>
            </div>

            <div class="clue-group">
                <h3>Verticais</h3>
                <ul id="vertical-clues"></ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
